name: build-images

# Builds and pushes two images to GHCR so you can deploy them straight onto servers (no local build):
#   ghcr.io/<owner>/boxcutter-server   the API + built SPA (single origin) — multi-arch: amd64 + arm64
#   ghcr.io/<owner>/boxcutter-agent    the scanner (boxcutter image + supervisor) — amd64 only, see below
#
# Runs on pushes to the default branch, on version tags (v1.2.3), and on demand. Each build produces a
# multi-arch manifest, so `docker pull …:latest` picks the right architecture automatically.
#
# The agent is FROM ghcr.io/zzzteph/boxcutter, whose `latest` is amd64 (x64) only — so the agent is built for
# amd64 only (an arm64 build would fail: no arm64 base). Once that base publishes arm64, add linux/arm64 to the
# agent's `platforms` below and it becomes multi-arch too.
#
# If the base image is PRIVATE, add a repo secret GHCR_TOKEN (a PAT with read:packages for the base +
# write:packages to push); it's used automatically below. If the base is public, GITHUB_TOKEN is enough.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: boxcutter-server   # single Dockerfile, `server` target: build SPA + API, one origin
            target: server
            platforms: linux/amd64,linux/arm64
          - name: boxcutter-agent    # `agent` target: base ghcr.io/zzzteph/boxcutter is amd64-only
            target: agent
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3     # register emulators so the amd64 runner can build arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_TOKEN (if set) can pull a private base image + push; otherwise fall back to GITHUB_TOKEN.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
