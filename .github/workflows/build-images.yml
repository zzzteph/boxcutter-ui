name: build-images

# Builds and pushes images to GHCR so you can deploy them straight onto servers (no local build):
#   ghcr.io/<owner>/boxcutter-server   all-in-one: API + built SPA + one built-in agent — multi-arch amd64+arm64
#   ghcr.io/<owner>/boxcutter-agent    the scale-out scanner (boxcutter image + supervisor) — multi-arch amd64+arm64
#
# Runs on pushes to the default branch, on version tags (v1.2.3), on demand, and DAILY. Each build produces a
# multi-arch manifest, so `docker pull …:latest` picks the right architecture automatically.
#
# The daily run is what keeps the engine current: both images are FROM ghcr.io/zzzteph/boxcutter:latest, which
# is updated far more often than this repo, so without a scheduled rebuild a new boxcutter would never reach
# anyone until someone happened to push a commit here. With `pull: true` below, every run re-resolves that
# base — so each image eventually gets rebuilt onto the newest engine on its own. The version each agent
# reports on the Scanners page is what shows which engine a running scanner ended up with.
#
# Both images are FROM ghcr.io/zzzteph/boxcutter, whose `latest` manifest carries amd64 AND arm64 — so both
# architectures build cleanly. (If that base ever drops an arch, the matching build here would fail until it's
# republished.)
#
# If the base image is PRIVATE, add a repo secret GHCR_TOKEN (a PAT with read:packages for the base +
# write:packages to push); it's used automatically below. If the base is public, GITHUB_TOKEN is enough.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  schedule:
    # Daily, off the hour (on-the-hour crons queue behind everyone else's and get delayed). GitHub disables
    # scheduled workflows in a repo with no activity for 60 days — re-enable it from the Actions tab if that
    # ever happens, or just push a commit.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: the images are only built/pushed if the test suite is green.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (api + dev deps)
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: api
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: boxcutter-server   # `server` target: all-in-one (SPA + API + built-in agent), one origin
            target: server
            platforms: linux/amd64,linux/arm64
          - name: boxcutter-agent    # `agent` target: the scale-out scanner
            target: agent
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3     # register emulators so the amd64 runner can build arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_TOKEN (if set) can pull a private base image + push; otherwise fall back to GITHUB_TOKEN.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          # Always re-fetch ghcr.io/zzzteph/boxcutter:latest instead of letting the gha cache serve a stale
          # base layer - a rebuild has to actually pick up the newest engine, which is what the Scanners page
          # then reports as each agent's boxcutter version.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
