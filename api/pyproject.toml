[project]
name = "boxcutter-ui-api"
version = "0.1.0"
description = "boxcutter-ui server: auth, scans, the DB-backed job queue, findings, and runner endpoints"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.2",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0.1,<4.1",   # passlib 1.7.4 (EOL) breaks on bcrypt>=4.1; pin to a compatible release
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "pymysql>=1.1",         # MariaDB / MySQL driver (pure-python); used when DATABASE_URL is mysql+pymysql://
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
